  const rB=new Float64Array(count), dT=new Float64Array(count);
  const power=new Float64Array(count), phase=new Float64Array(count);
  let seed=19470123;
  function rand() {seed|=0; seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}
  // A single, low-frequency seeded radial field, shared by neighbouring strokes.
  const wavePhase=rand()*TAU;
  for (let i=0;i<count;i++) {
    const v=DATA.points[i]; rA[i]=v[0];tA[i]=v[1];rB[i]=v[2];dT[i]=v[3];
    const materialRadius=(rA[i]+rB[i])/2;
    power[i]=0.56+1.89*Math.pow(clamp((materialRadius-8)/490),1.35);
    phase[i]=0.009*Math.sin(materialRadius/110+wavePhase);
  }
  let W=0,H=0,DPR=1,scale=1,cx=0,cy=0,lineWidth=1;
  let target=0,current=0,vel=0,last=performance.now(),lastPaint=NaN,lastUI=0;
  let auto=false,autoOrigin=0,autoBegin=0,autoDuration=18000;
  let sensor=false,sensorGotData=false,prevQ=null,accum=0,timeoutID=0;
  let direction=1,sensitivity=1,sensorType='roll',rawHeading=null;
  let gain=1,clean=false,scrubbing=false;
  const params=new URLSearchParams(location.search);
  let lockedForCapture=params.has('clean');

  // Every visible coordinate is a pure function of angle. No time, velocity,
  // random calls or per-frame sampling enters this function.
  function paint(angle) {
    const p=clamp(angle/360), f=smooth(.035,.97,p);
    // The second sentence begins to emerge once the phone reaches 180°.
    // From that point onward, the same strokes gradually reassemble into
    // the target line work, while the target layout itself rotates 180°
    // so the final sentence appears upside down like the phone has turned.
    const morph=smooth(.50,.94,p);
    const targetFlip=Math.PI*smooth(.50,1.0,p);
    const wave=Math.sin(Math.PI*f), vortex=wave*wave;
    const length=8.05*(1+.23*vortex);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#fff';ctx.lineWidth=lineWidth;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
    ctx.beginPath();
    for(let i=0;i<count;i++) {
      // Clockwise +theta in the canvas coordinate system. The radius-dependent
      // phase law reaches exactly one turn at 360 degrees for every stroke,
      // but neighbouring radii turn at different, continuously varying rates.
      const phaseTurn = f===0 ? 0 : f===1 ? TAU : TAU*Math.pow(f,power[i]);
      const th=tA[i]+dT[i]*morph+phaseTurn+targetFlip+phase[i]*vortex;
      let r=(rA[i]+(rB[i]-rA[i])*morph);
      r*=1+.026*vortex*Math.sin((rA[i]+rB[i])/250+f*1.2);
      r=Math.max(8,r);
      const radius=r*scale, half=Math.min(.68,length/(2*r));
      const c=Math.cos(th),s=Math.sin(th),ch=Math.cos(half),sh=Math.sin(half);
      // Exact endpoint/tangent construction for a circular cubic Bezier.
      // Its curvature vector points INWARD. The handles lie on endpoint
      // tangents, not at an arbitrary inward displacement of the chord.
      const handle=4/3*radius*Math.tan(half/2);
      const x0=cx+radius*(c*ch+s*sh),y0=cy+radius*(s*ch-c*sh);
      const x3=cx+radius*(c*ch-s*sh),y3=cy+radius*(s*ch+c*sh);
      const tx0=c*sh-s*ch,ty0=s*sh+c*ch;
      const tx3=-c*sh-s*ch,ty3=-s*sh+c*ch;
      ctx.moveTo(x0,y0);
      ctx.bezierCurveTo(x0+handle*tx0,y0+handle*ty0,x3-handle*tx3,y3-handle*ty3,x3,y3);
    }
    // One stroke call for the full line field. No text overlays or particles.
    ctx.stroke();
    lastPaint=angle;
  }
  function resize() {
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    cx=W/2;cy=H/2;
    scale=Math.min(W*.94/1000,H*.77/1000)*gain;
    lineWidth=Math.max(.88,Math.min(1.9,scale*2.45));
    paint(current);
  }
  function stage(p) {
    if(p<.12)return UI.stageA;
    if(p<.39)return UI.stageIn;
    if(p<.63)return UI.stageVortex;
    if(p<.85)return UI.stageOut;
    return UI.stageB;
  }
  function updateUI() {
    $('angle').textContent=current.toFixed(1).padStart(5,'0')+'\u00b0';
    if(!scrubbing)$('scrub').value=current;
    $('scrub').style.setProperty('--progress',((scrubbing?target:current)/3.6)+'%');
    $('stage').textContent=stage(current/360);
    $('play').textContent=auto?UI.pause:current>359.9?UI.replay:UI.play;
    $('gyro').textContent=sensor?UI.gyroOff:UI.gyro;
    $('mode').textContent=sensor?UI.modeGyro:auto?UI.modeAuto:UI.modeManual;
  }
  function say(message) {$('status').textContent=message;}
  function detachSensor() {
    sensor=false;prevQ=null;rawHeading=null;clearTimeout(timeoutID);
    window.removeEventListener('deviceorientation',onOrientation);
  }
  function manual(angle,immediate=false) {
    auto=false;detachSensor();target=clamp(Number(angle)||0,0,360);
    if(immediate){current=target;vel=0;paint(current);}
    say(UI.manualHelp);updateUI();
  }
  function startAuto() {
    detachSensor();
    if(current>359.9) {current=0;target=0;vel=0;paint(0);}
    autoOrigin=current;autoBegin=performance.now();
    autoDuration=Math.max(1000,18000*(1-autoOrigin/360));auto=true;
    say(UI.previewHelp);updateUI();
  }
  function tick(now) {
    const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;
    if(auto) {
      const t=clamp((now-autoBegin)/autoDuration);
      target=autoOrigin+(360-autoOrigin)*t;
      if(t>=1){auto=false;say(UI.endHelp);}
    }
    // Analytic, critically damped spring. Frame-rate independent, no bouncing.
    const omega=19,decay=Math.exp(-omega*dt),err=current-target;
    const t=(vel+omega*err)*dt;
    current=target+(err+t)*decay;vel=(vel-omega*t)*decay;
    current=clamp(current,0,360);
    if(Math.abs(current-target)<.0005&&Math.abs(vel)<.005){current=target;vel=0;}
    if(!Number.isFinite(lastPaint)||Math.abs(current-lastPaint)>.0001)paint(current);
    if(now-lastUI>50){updateUI();lastUI=now;}
    requestAnimationFrame(tick);
  }
  $('play').addEventListener('click',()=>{
    if(auto){auto=false;target=current;vel=0;say(UI.paused);}else startAuto();
    updateUI();
  });
  $('reset').addEventListener('click',()=>{manual(0,true);say(UI.ready);});
  $('scrub').addEventListener('input',e=>manual(e.target.value));
  $('scrub').addEventListener('pointerdown',()=>{scrubbing=true;auto=false;detachSensor();});
  window.addEventListener('pointerup',()=>{scrubbing=false;});
  window.addEventListener('pointercancel',()=>{scrubbing=false;});
  document.querySelectorAll('[data-angle]').forEach(b=>b.addEventListener('click',()=>manual(Number(b.dataset.angle))));
  window.addEventListener('keydown',e=>{
    if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();$('play').click();}
    else if(e.key==='ArrowRight'){e.preventDefault();manual(target+(e.shiftKey?15:3));}
    else if(e.key==='ArrowLeft'){e.preventDefault();manual(target-(e.shiftKey?15:3));}
    else if(e.key==='Home'){e.preventDefault();manual(0);}
    else if(e.key==='End'){e.preventDefault();manual(360);}
    else if(e.key==='Escape'){setClean(false);$('options').open=false;}
  });
  // Drag around the centre like a dial; keyboard and slider remain alternatives.
  let dragging=false,dragPrev=0;
  canvas.addEventListener('pointerdown',e=>{
    manual(current);dragging=true;dragPrev=Math.hypot(e.clientX-cx,e.clientY-cy)<30?null:Math.atan2(e.clientY-cy,e.clientX-cx);
    canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-cx,dy=e.clientY-cy;
    if(Math.hypot(dx,dy)<30){dragPrev=null;return;}
    const a=Math.atan2(dy,dx);if(dragPrev===null){dragPrev=a;return;}
    let delta=(a-dragPrev)/DEG;dragPrev=a;
    if(delta>180)delta-=360;if(delta< -180)delta+=360;
    target=clamp(target+delta,0,360);
  });
  function dragEnd(){dragging=false;canvas.classList.remove('dragging');}
  canvas.addEventListener('pointerup',dragEnd);canvas.addEventListener('pointercancel',dragEnd);

  // W3C orientation order: Rz(alpha) * Rx(beta) * Ry(gamma).
  // Relative quaternion twist around the DEVICE Z axis tracks rotating the
  // phone like a dial, unlike alpha alone (which tracks the earth Z axis).
  const qNow=new Float64Array(4),qPrevious=new Float64Array(4);
  function onOrientation(e) {
    if(!sensor||!Number.isFinite(e.alpha)||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;
    if(!sensorGotData){sensorGotData=true;clearTimeout(timeoutID);say(UI.sensorHelp);}
    let delta=0;
    if(sensorType==='heading'){
      const raw=e.alpha;
      if(rawHeading===null){rawHeading=raw;return;}
      delta=raw-rawHeading;rawHeading=raw;
      if(delta>180)delta-=360;if(delta< -180)delta+=360;
      delta=-delta;
    }else{
      const a=e.alpha*DEG/2,b=e.beta*DEG/2,g=e.gamma*DEG/2;
      const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
      qNow[0]=ca*sb*cg-sa*cb*sg;qNow[1]=ca*cb*sg+sa*sb*cg;
      qNow[2]=ca*sb*sg+sa*cb*cg;qNow[3]=ca*cb*cg-sa*sb*sg;
      if(prevQ===null){qPrevious.set(qNow);prevQ=true;return;}
      let w=qPrevious[3]*qNow[3]+qPrevious[0]*qNow[0]+qPrevious[1]*qNow[1]+qPrevious[2]*qNow[2];
      let z=qPrevious[3]*qNow[2]-qPrevious[2]*qNow[3]-qPrevious[0]*qNow[1]+qPrevious[1]*qNow[0];
      if(w<0){w=-w;z=-z;}
      delta=-2*Math.atan2(z,w)/DEG;
      qPrevious.set(qNow);
    }
    // Reject a sensor restart/outlier, not normal wraparound.
    if(!Number.isFinite(delta)||Math.abs(delta)>55)return;
    // Clamp the accumulator too: reverse immediately at either endpoint.
    accum=clamp(accum+delta*direction*sensitivity,0,360);
    target=accum;
  }
  async function enableGyro() {
    if(sensor){detachSensor();say(UI.manualHelp);updateUI();return;}
    auto=false;
    if(!window.isSecureContext){say(UI.needHTTPS);updateUI();return;}
    if(!('DeviceOrientationEvent' in window)){say(UI.noSensor);updateUI();return;}
    try {
      // Called directly by a user gesture: necessary for the iOS permission UI.
      if(typeof DeviceOrientationEvent.requestPermission==='function') {
        const result=await DeviceOrientationEvent.requestPermission();
        if(result!=='granted'){say(UI.denied);updateUI();return;}
      }
      sensor=true;sensorGotData=false;prevQ=null;rawHeading=null;
      accum=0;target=0;current=0;vel=0;paint(0);
      window.addEventListener('deviceorientation',onOrientation,{passive:true});
      say(UI.waitSensor);updateUI();
      timeoutID=setTimeout(()=>{
        if(!sensorGotData){detachSensor();say(UI.noData);updateUI();}
      },4500);
    }catch(err){detachSensor();say(UI.permissionError+' '+(err.message||''));updateUI();}
  }
  $('gyro').addEventListener('click',enableGyro);
  $('calibrate').addEventListener('click',()=>{
    accum=0;prevQ=null;rawHeading=null;target=0;current=0;vel=0;auto=false;paint(0);say(UI.calibrated);updateUI();
  });
  $('axis').addEventListener('change',e=>{
    sensorType=e.target.value;prevQ=null;rawHeading=null;accum=current;say(UI.axisChanged);
  });
  $('direction').addEventListener('change',e=>{direction=e.target.checked?-1:1;prevQ=null;rawHeading=null;accum=current;});
  $('sensitivity').addEventListener('change',e=>{sensitivity=Number(e.target.value);accum=current;});
  function setClean(on) {
    clean=on;document.body.classList.toggle('clean',on);
    $('restore').hidden=!on||lockedForCapture;
  }
  $('clean').addEventListener('click',()=>setClean(true));
  $('restore').addEventListener('click',()=>setClean(false));
  $('fullscreen').addEventListener('click',async()=>{
    try{
      if(!document.fullscreenElement&&document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
        try{await screen.orientation.lock('portrait');}catch(_){/* optional */}
      }else if(document.fullscreenElement)await document.exitFullscreen();
      else say(UI.noFullscreen);
    }catch(_){say(UI.noFullscreen);}
  });
  document.addEventListener('visibilitychange',()=>{
    last=performance.now();prevQ=null;rawHeading=null;
    if(document.hidden){auto=false;target=current;vel=0;}
  });
  window.addEventListener('resize',resize,{passive:true});

  // Stable hooks used for visual QA and offline animation export.
  window.vortex={
    setAngle(a){manual(a,true);return current;},
    setClean(on){lockedForCapture=!!on;setClean(!!on);},
    getStats(){return {count,angle:current,target,width:W,height:H,dpr:DPR,strokeWidth:lineWidth,sensor,auto};},
    paint,
    getSource(){return {a:DATA.source,b:DATA.target};},
    capture(a){manual(a,true);return canvas.toDataURL('image/png');},
    verifyGeometry(){
      let minD=Infinity;
      for(let i=0;i<count;i++){
        let prev=tA[i];
        for(let k=1;k<=720;k++){
          const p=k/720,f=smooth(.035,.97,p),v=Math.sin(Math.PI*f)**2;
          const th=tA[i]+dT[i]*smooth(.43,.82,p)+TAU*Math.pow(f,power[i])+phase[i]*v;
          minD=Math.min(minD,th-prev);prev=th;
        }
      }
      return {count,minAngularStep:minD,allClockwise:minD>=-1e-9,constantStroke:lineWidth};
    }
  };
  document.querySelectorAll('[data-label]').forEach(el=>el.textContent=UI[el.dataset.label]||'');
  $('sourceText').textContent=DATA.source;$('targetText').textContent=DATA.target;
  resize();say(UI.ready);updateUI();
  if(params.has('angle'))manual(Number(params.get('angle')),true);
  if(lockedForCapture)setClean(true);
  if(!params.has('manual')&&!lockedForCapture&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    auto=true;autoOrigin=0;autoBegin=performance.now()+900;say(UI.previewHelp);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
